project_id = "recipe-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed-local-admin.sql"]

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[studio]
enabled = true
port = 54323

# Local email capture only; Supabase Auth routes its development emails here.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3000/auth/complete", "http://localhost:3000/auth/reset-password", "http://127.0.0.1:3000/auth/complete", "http://127.0.0.1:3000/auth/reset-password"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true

[storage.vector]
enabled = false

# Cloud email confirmations must never redirect to a development machine.
[remotes.production]
project_id = "cbwrvcifxcqyrgtcpvbd"

[remotes.production.auth]
site_url = "https://recipe-app-alpha-wine.vercel.app"
additional_redirect_urls = ["https://recipe-app-alpha-wine.vercel.app", "https://recipe-app-alpha-wine.vercel.app/auth/complete", "https://recipe-app-alpha-wine.vercel.app/auth/reset-password", "http://localhost:3000", "http://localhost:3000/auth/complete", "http://localhost:3000/auth/reset-password", "http://127.0.0.1:3000/auth/complete", "http://127.0.0.1:3000/auth/reset-password"]

[remotes.production.auth.email]
enable_confirmations = true
